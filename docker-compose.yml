services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: silkreel
      POSTGRES_USER: silkreel
      POSTGRES_PASSWORD: silkreel
    ports:
      - "6610:5432"
    volumes:
      - silkreel_5210_9210_6610_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U silkreel -d silkreel"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 40s

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+asyncpg://silkreel:silkreel@db:5432/silkreel
      JWT_SECRET: silkreel-dev-secret
    ports:
      - "9210:8760"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    ports:
      - "5210:80"
    depends_on:
      - backend

volumes:
  silkreel_5210_9210_6610_pg: